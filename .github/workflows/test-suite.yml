name: Test suite - single job

on:
  push:
    branches:
      - demo/bad-test-suite
  pull_request:

jobs:
  single-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run suite in one job
        run: |
          start=$(date +%s)
          ./gradlew test
          end=$(date +%s)
          echo "single-job test: $((end - start)) seconds" >> "$GITHUB_STEP_SUMMARY"
