name: Optimized test suite

on:
  push:
    branches:
      - demo/optimized-test-suite
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run unit tests
        run: |
          start=$(date +%s)
          ./gradlew unitTest
          end=$(date +%s)
          echo "unitTest: $((end - start)) seconds" >> "$GITHUB_STEP_SUMMARY"

  slice-test:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run slice tests
        run: |
          start=$(date +%s)
          ./gradlew sliceTest
          end=$(date +%s)
          echo "sliceTest: $((end - start)) seconds" >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    runs-on: ubuntu-latest
    needs: slice-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run integration tests
        run: |
          start=$(date +%s)
          ./gradlew integrationTest
          end=$(date +%s)
          echo "integrationTest: $((end - start)) seconds" >> "$GITHUB_STEP_SUMMARY"
