name: Bad test suite

on:
  push:
    branches:
      - demo/bad-test-suite
  pull_request:

jobs:
  broad-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run broad test task
        run: |
          start=$(date +%s)
          ./gradlew test
          end=$(date +%s)
          echo "test: $((end - start)) seconds" >> "$GITHUB_STEP_SUMMARY"
