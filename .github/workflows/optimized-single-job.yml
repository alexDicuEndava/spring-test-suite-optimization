name: Optimized test suite - single job

on:
  push:
    branches:
      - demo/optimized-test-suite
  pull_request:

jobs:
  optimized-single-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run optimized suite in one job
        run: |
          start=$(date +%s)
          ./gradlew check
          end=$(date +%s)
          echo "optimized single-job check: $((end - start)) seconds" >> "$GITHUB_STEP_SUMMARY"
